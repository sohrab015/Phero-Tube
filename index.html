<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Phero Tube</title>
</head>

<body class="md:px-24 px-12">

    <!-- Navbar Section -->

    <header>

        <nav class="w-11/12 mx-auto flex justify-between text-center items-center border-b-2 py-5 border-[#17171720]">

            <div class="logo">
                <img class="w-[120px]" src="assets/Logo.png" alt="Phero Tube Logo">
            </div>

            <div class="sort mx-2">

                <label class="input rounded-3xl pr-0">
                    <svg class="h-[3rem] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                            stroke="currentColor">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.3-4.3"></path>
                        </g>
                    </svg>
                    <input id="search-input" type="search" required placeholder="Search" />

                    <button id="search-btn" class="btn btn-error rounded-r-3xl bg-[#FF1F3D] text-white border-none">Search</button>
                </label>

            </div>

            <div class="blog">
                <button class="btn rounded-lg bg-[#FF1F3D] text-white font-bold border-none">Sort</button>
            </div>

        </nav>

    </header>


    <!-- Category Navbar -->

    <nav class="flex justify-center py-5 mb-10">

        <div id="catagory-container"
            class="flex flex-wrap justify-center gap-3 pb-5 border-b-2 border-[#17171720] w-full">

            <button class="btn btn-sm border-none bg-[#FF1F3D] text-white">
                All
            </button>

        </div>

    </nav>


    <!-- Main Section -->

    <main>

        <h1 class="p-10 font-bold text-4xl md:text-6xl flex justify-center items-center text-center">
            Contents
        </h1>

        <section id="video-container"
            class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-5">

        </section>

    </main>


    <footer></footer>


    <!-- JavaScript -->

    <script src="scripts/first.js"></script>

</body>

</html>
